name: LocalCodeLink checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npm test
        env:
          NODE_NO_WARNINGS: "1"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:package
        env:
          NODE_NO_WARNINGS: "1"
      - run: node scripts/verify-source-install.mjs "https://github.com/joinotto/local-code-link/archive/${{ github.sha }}.tar.gz"
        env:
          NODE_NO_WARNINGS: "1"
      - run: npm run check:release
